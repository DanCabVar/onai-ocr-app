name: Deploy to Production (master)

on:
  push:
    branches: [master, deploy/all-features]

concurrency:
  group: deploy-master
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/dancabvar/onai-ocr

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend, processor]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}

  deploy:
    name: Deploy to Server
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: 20m
          script: |
            set -e
            cd /docker/onai-ocr
            backup_dir="./backups"
            mkdir -p "$backup_dir"
            backup_file="$backup_dir/pre-migration-$(date +%Y%m%d-%H%M%S).sql"
            docker compose pull
            docker compose up -d postgres
            docker compose exec -T postgres sh -lc 'PGPASSWORD="$DB_PASSWORD" pg_dump -U "$DB_USER" "$DB_NAME"' > "$backup_file"
            echo "✅ Backup DB creado en $backup_file"
            docker compose run --rm backend pnpm db:migrate
            docker compose up -d --remove-orphans
            docker image prune -f
            curl -sf https://ocr.moti.cl/api/auth/health
            echo "✅ Deploy + migrations completado: $(date)"
