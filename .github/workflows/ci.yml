name: CI - Lint & Build Check

on:
  push:
    branches: [deploy/all-features]
  pull_request:
    branches: [dev, qa, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────
  # Backend (NestJS) - Lint + Build
  # ─────────────────────────────────────
  backend:
    name: Backend - Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - run: pnpm install --frozen-lockfile
      - name: Security audit (non-blocking)
        run: pnpm audit --prod --audit-level=high
        continue-on-error: true
      - name: Lint (if ESLint config exists)
        run: |
          if [ -f "eslint.config.js" ] || [ -f "eslint.config.mjs" ] || [ -f ".eslintrc" ] || [ -f ".eslintrc.js" ] || [ -f ".eslintrc.cjs" ] || [ -f ".eslintrc.json" ] || [ -f ".eslintrc.yaml" ] || [ -f ".eslintrc.yml" ]; then
            pnpm run lint
          else
            echo "Skipping lint: no ESLint config found in backend/"
          fi
      - run: pnpm run build

  # ─────────────────────────────────────
  # Frontend (Next.js) - Lint + Build
  # ─────────────────────────────────────
  frontend:
    name: Frontend - Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - run: pnpm install --frozen-lockfile
      - name: Security audit (non-blocking)
        run: pnpm audit --prod --audit-level=high
        continue-on-error: true
      - name: Lint (if ESLint config exists)
        run: |
          if [ -f "eslint.config.js" ] || [ -f "eslint.config.mjs" ] || [ -f ".eslintrc" ] || [ -f ".eslintrc.js" ] || [ -f ".eslintrc.cjs" ] || [ -f ".eslintrc.json" ] || [ -f ".eslintrc.yaml" ] || [ -f ".eslintrc.yml" ]; then
            pnpm run lint
          else
            echo "Skipping lint: no ESLint config found in frontend/"
          fi
      - run: pnpm run build

  e2e-smoke:
    name: Frontend - E2E Smoke (Playwright)
    runs-on: ubuntu-latest
    needs: [frontend]
    defaults:
      run:
        working-directory: frontend
    env:
      E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:e2e:install
      - name: Run smoke E2E
        run: pnpm run test:e2e:smoke

      - name: Upload Playwright artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-artifacts
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore

  # ─────────────────────────────────────
  # Processor (Python) - Lint + Type Check
  # ─────────────────────────────────────
  processor:
    name: Processor - Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: processor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ruff
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

  # ─────────────────────────────────────
  # Docker Build Check (no push)
  # ─────────────────────────────────────
  docker-build:
    name: Docker Build - ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend, processor]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
